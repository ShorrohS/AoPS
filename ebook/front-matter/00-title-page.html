<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AoPS — Volume 0: Before Computers — Title Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:          #1C1C1C;
    --paper:        #F5F4EF;
    --warm:         #EEECE4;
    --bone:         #E8E5DC;
    --ghost:        #D4D0C4;
    --indigo:       #1C2D42;
    --lacquer:      #C82A2A;
    --gold:         #8B6914;
    --sage:         #3D5B3F;
    --slate:        #4A5568;
    --indigo-tint:  rgba(28,45,66,0.08);
    --font-display: 'Noto Serif JP', Georgia, serif;
    --font-body:    'EB Garamond', Georgia, serif;
    --font-sans:    'Inter', system-ui, sans-serif;
    --font-mono:    'JetBrains Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: #C8C6C0; }

  body {
    background: #C8C6C0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px 24px;
    font-family: var(--font-body);
  }

  /* Page shell — A5 portrait proportion */
  .page {
    width: 720px;
    min-height: 1020px;
    background: var(--paper);
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 12px 48px rgba(0,0,0,0.22),
      0 2px 8px rgba(0,0,0,0.14);
  }

  /* Running header strip */
  .running-header {
    height: 36px;
    border-bottom: 0.5px solid var(--ghost);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 64px;
    flex-shrink: 0;
  }
  .running-header span {
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ghost);
  }

  /* Main content area */
  .page-body {
    flex: 1;
    padding: 0 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* ── Top section ── */
  .series-label {
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--lacquer);
    margin-bottom: 32px;
  }

  /* Ornamental kamon divider */
  .kamon {
    width: 32px;
    height: 32px;
    margin: 0 auto 40px;
    opacity: 0.22;
  }

  /* ── Publisher logotype ── */
  .pub-logotype {
    font-family: var(--font-display);
    font-size: 52px;
    font-weight: 200;
    color: var(--ink);
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 8px;
  }

  .pub-name {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 56px;
  }

  /* ── Central rule ── */
  .rule-full {
    width: 100%;
    height: 1px;
    background: var(--ghost);
    margin-bottom: 56px;
  }

  .rule-short {
    width: 40px;
    height: 1px;
    background: var(--indigo);
    margin: 0 auto;
  }

  /* ── Volume badge ── */
  .volume-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }

  .vol-chip {
    font-family: var(--font-sans);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--lacquer);
    border: 1px solid rgba(200,42,42,0.35);
    padding: 4px 12px;
    border-radius: 1px;
  }

  .vol-rule {
    width: 32px;
    height: 1px;
    background: var(--ghost);
  }

  .vol-label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--slate);
  }

  /* ── Book title block ── */
  .book-title {
    font-family: var(--font-display);
    font-size: 52px;
    font-weight: 300;
    color: var(--ink);
    letter-spacing: -0.025em;
    line-height: 1.0;
    margin-bottom: 20px;
  }

  .book-subtitle {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 300;
    color: var(--indigo);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 48px;
  }

  /* ── Illustration zone ── */
  .title-illustration {
    margin: 0 auto 48px;
    opacity: 0.75;
  }

  /* ── Bottom section ── */
  .bottom-section {
    margin-top: auto;
    width: 100%;
    border-top: 1px solid var(--bone);
    padding-top: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding-bottom: 0;
  }

  /* This book is part of... */
  .series-note {
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ghost);
    margin-bottom: 20px;
  }

  /* Level badge */
  .level-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 400;
    color: var(--indigo);
    letter-spacing: 0.06em;
    border-bottom: 1px solid rgba(28,45,66,0.22);
    padding-bottom: 4px;
    margin-bottom: 24px;
  }

  /* Japanese title — aesthetic only, set in very small type below */
  .japanese-subtitle {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 300;
    color: var(--ghost);
    letter-spacing: 0.1em;
    margin-bottom: 32px;
  }

  /* Publisher footer */
  .publisher-footer {
    width: 100%;
    border-top: 0.5px solid var(--ghost);
    padding: 20px 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .pub-mark {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pub-mark-name {
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--slate);
  }

  .page-num {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 400;
    color: var(--ghost);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="page">

  <!-- Running header -->
  <div class="running-header">
    <span>Art of Problem Solving</span>
    <span>Computer Science Series</span>
  </div>

  <!-- Main body -->
  <div class="page-body">

    <!-- Series label -->
    <p class="series-label">Art of Problem Solving — Computer Science Series</p>

    <!-- Ornamental divider -->
    <svg class="kamon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="14" stroke="#1C1C1C" stroke-width="1"/>
      <circle cx="16" cy="16" r="8"  stroke="#1C1C1C" stroke-width="0.7"/>
      <circle cx="16" cy="16" r="2.5" fill="#1C1C1C"/>
      <line x1="16" y1="2"  x2="16" y2="8"  stroke="#1C1C1C" stroke-width="0.8"/>
      <line x1="16" y1="24" x2="16" y2="30" stroke="#1C1C1C" stroke-width="0.8"/>
      <line x1="2"  y1="16" x2="8"  y2="16" stroke="#1C1C1C" stroke-width="0.8"/>
      <line x1="24" y1="16" x2="30" y2="16" stroke="#1C1C1C" stroke-width="0.8"/>
      <line x1="6"  y1="6"  x2="10" y2="10" stroke="#1C1C1C" stroke-width="0.6"/>
      <line x1="22" y1="22" x2="26" y2="26" stroke="#1C1C1C" stroke-width="0.6"/>
      <line x1="26" y1="6"  x2="22" y2="10" stroke="#1C1C1C" stroke-width="0.6"/>
      <line x1="10" y1="22" x2="6"  y2="26" stroke="#1C1C1C" stroke-width="0.6"/>
    </svg>

    <!-- AoPS logotype -->
    <h1 class="pub-logotype">AoPS</h1>
    <p class="pub-name">Art of Problem Solving</p>

    <div class="rule-full"></div>

    <!-- Volume badge -->
    <div class="volume-badge">
      <div class="vol-rule"></div>
      <span class="vol-chip">Volume 0</span>
      <div class="vol-rule"></div>
    </div>

    <!-- Book title -->
    <h2 class="book-title">Before Computers</h2>
    <p class="book-subtitle">The Origins of Computation</p>

    <!-- Central ink-wash illustration — abacus dissolving into dots -->
    <svg class="title-illustration" viewBox="0 0 440 80" fill="none" xmlns="http://www.w3.org/2000/svg" width="440" height="80" aria-label="Decorative illustration: abacus beads dissolving into binary dots">
      <!-- Abacus frame, left -->
      <g stroke="#1C1C1C" stroke-width="0.7" opacity="0.3">
        <line x1="20" y1="10" x2="20" y2="70"/>
        <line x1="50" y1="10" x2="50" y2="70"/>
        <line x1="80" y1="10" x2="80" y2="70"/>
        <line x1="110" y1="10" x2="110" y2="70"/>
        <line x1="10" y1="40" x2="120" y2="40" stroke-width="1.2"/>
        <line x1="10" y1="10" x2="120" y2="10"/>
        <line x1="10" y1="70" x2="120" y2="70"/>
        <line x1="10" y1="10" x2="10" y2="70"/>
        <line x1="120" y1="10" x2="120" y2="70"/>
      </g>
      <!-- Beads solid -->
      <g fill="#1C2D42" opacity="0.45">
        <ellipse cx="20" cy="26" rx="9" ry="6"/>
        <ellipse cx="50" cy="26" rx="9" ry="6"/>
        <ellipse cx="80" cy="32" rx="9" ry="6"/>
        <ellipse cx="110" cy="26" rx="9" ry="6"/>
      </g>
      <g fill="#C82A2A" opacity="0.5">
        <ellipse cx="20" cy="54" rx="9" ry="6"/>
        <ellipse cx="80" cy="54" rx="9" ry="6"/>
      </g>
      <g fill="#1C2D42" opacity="0.25">
        <ellipse cx="50" cy="54" rx="9" ry="6"/>
        <ellipse cx="110" cy="54" rx="9" ry="6"/>
      </g>

      <!-- Dissolving transition — beads becoming circles becoming dots -->
      <g opacity="0.28">
        <circle cx="148" cy="30" r="7" stroke="#1C2D42" stroke-width="0.8" fill="none"/>
        <circle cx="148" cy="52" r="7" stroke="#1C2D42" stroke-width="0.8" fill="none"/>
        <circle cx="172" cy="30" r="6" stroke="#1C2D42" stroke-width="0.7" fill="none"/>
        <circle cx="172" cy="52" r="6" stroke="#1C2D42" stroke-width="0.7" fill="none"/>
        <circle cx="194" cy="30" r="4.5" stroke="#1C2D42" stroke-width="0.6" fill="rgba(28,45,66,0.1)"/>
        <circle cx="194" cy="52" r="4.5" stroke="#1C2D42" stroke-width="0.6" fill="none"/>
        <circle cx="214" cy="30" r="3" fill="#1C2D42" opacity="0.5"/>
        <circle cx="214" cy="52" r="3" fill="#1C2D42" opacity="0.25"/>
        <circle cx="230" cy="30" r="2.2" fill="#1C2D42" opacity="0.4"/>
        <circle cx="230" cy="52" r="2.2" fill="#1C2D42" opacity="0.15"/>
      </g>

      <!-- Binary dot matrix, right — fading in -->
      <g font-family="JetBrains Mono, monospace" font-size="11" fill="#1C2D42">
        <text x="250" y="26" opacity="0.55">1</text>
        <text x="264" y="26" opacity="0.45">0</text>
        <text x="278" y="26" opacity="0.38">1</text>
        <text x="292" y="26" opacity="0.30">1</text>
        <text x="306" y="26" opacity="0.22">0</text>
        <text x="320" y="26" opacity="0.15">0</text>
        <text x="334" y="26" opacity="0.09">1</text>
        <text x="348" y="26" opacity="0.05">0</text>
        <text x="250" y="55" opacity="0.40">0</text>
        <text x="264" y="55" opacity="0.35">1</text>
        <text x="278" y="55" opacity="0.28">0</text>
        <text x="292" y="55" opacity="0.20">0</text>
        <text x="306" y="55" opacity="0.14">1</text>
        <text x="320" y="55" opacity="0.09">1</text>
        <text x="334" y="55" opacity="0.05">0</text>
        <text x="348" y="55" opacity="0.03">1</text>
      </g>

      <!-- Fade mask — right edge -->
      <defs>
        <linearGradient id="fade-r" x1="0" y1="0" x2="1" y2="0">
          <stop offset="70%" stop-color="#F5F4EF" stop-opacity="0"/>
          <stop offset="100%" stop-color="#F5F4EF" stop-opacity="1"/>
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="440" height="80" fill="url(#fade-r)"/>
    </svg>

    <!-- Bottom section — series and level -->
    <div class="bottom-section">
      <p class="series-note">Part of the AoPS Computer Science Series &nbsp;·&nbsp; 13 Volumes</p>
      <p class="level-badge">LEVEL_0</p>
      <p class="japanese-subtitle">コンピュータの前に</p>
      <div class="rule-short"></div>
    </div>

  </div>

  <!-- Publisher footer -->
  <div class="publisher-footer">
    <div class="pub-mark">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="11" cy="11" r="9.5" stroke="#4A5568" stroke-width="0.8"/>
        <circle cx="11" cy="11" r="5.5" stroke="#4A5568" stroke-width="0.6"/>
        <circle cx="11" cy="11" r="1.8" fill="#4A5568"/>
        <line x1="11" y1="1.5" x2="11" y2="5.5"  stroke="#4A5568" stroke-width="0.7"/>
        <line x1="11" y1="16.5" x2="11" y2="20.5" stroke="#4A5568" stroke-width="0.7"/>
        <line x1="1.5" y1="11" x2="5.5" y2="11"   stroke="#4A5568" stroke-width="0.7"/>
        <line x1="16.5" y1="11" x2="20.5" y2="11" stroke="#4A5568" stroke-width="0.7"/>
      </svg>
      <span class="pub-mark-name">AoPS Press</span>
    </div>
    <span class="page-num">i</span>
  </div>

</div>

</body>
</html>
