<!DOCTYPE html>
<html lang="en" data-theme="zen">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>AoPS Universal Markdown Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Marked.js for fast client-side markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    
:root {
  --paper:        #F5F4EF;
  --paper-warm:   #EEECE4;
  --washi:        #FFFFFF;
  --bone:         #E8E5DC;
  --ghost:        #D4D0C4;
  --border-hair:  #1C1C1C;
  --border-light: #D8D6CE;
  --border-paper: #E8E6DF;
  --ink:          #1C1C1C;
  --text-body:    #2E2E2E;
  --slate:        #4A5568;
  --muted:        #787670;
  --indigo:       #1C2D42;
  --indigo-deep:  #0F1E2E;
  --lacquer:      #C82A2A;
  --gold:         #8B6914;
  --sage:         #3D5B3F;
  --card-bg:      #FFFFFF;
  --code-bg:      #EBE8DF;
  --callout-bg:   #FAF8F5;
  
  --font-display: 'Noto Serif JP', Georgia, serif;
  --font-body:    'EB Garamond', Georgia, serif;
  --font-sans:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono:    'JetBrains Mono', monospace;
  
  --shadow-sm:    0 1px 3px rgba(0,0,0,0.06);
  --shadow-md:    0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg:    0 12px 28px rgba(0,0,0,0.12);
  --radius-xs:    2px;
  --radius-sm:    4px;
  --radius-md:    8px;
}

[data-theme="dark"] {
  --paper:        #141619;
  --paper-warm:   #1A1D21;
  --washi:        #1E2227;
  --bone:         #2B3038;
  --ghost:        #3B424D;
  --border-hair:  #4A5260;
  --border-light: #2D333D;
  --border-paper: #22272E;
  --ink:          #E6EDF3;
  --text-body:    #C9D1D9;
  --slate:        #8B949E;
  --muted:        #8B949E;
  --indigo:       #58A6FF;
  --indigo-deep:  #161B22;
  --lacquer:      #FF7B72;
  --gold:         #D29922;
  --sage:         #7EE787;
  --card-bg:      #1C2128;
  --code-bg:      #21262D;
  --callout-bg:   #1F242C;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  background: var(--paper);
  color: var(--text-body);
  font-family: var(--font-body);
  font-size: 1.125rem;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

a {
  color: var(--indigo);
  text-decoration: none;
  transition: color 0.15s ease, border-color 0.15s ease;
}

a:hover {
  text-decoration: underline;
}

code, kbd, samp, pre {
  font-family: var(--font-mono);
  font-size: 0.9em;
}

pre {
  background: var(--code-bg);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  padding: 1rem 1.25rem;
  overflow-x: auto;
  margin: 1.5rem 0;
  line-height: 1.5;
}

code:not(pre code) {
  background: var(--code-bg);
  border: 1px solid var(--border-light);
  padding: 0.15em 0.4em;
  border-radius: 3px;
  font-size: 0.88em;
  color: var(--ink);
}

/* Zen Progress Bar */
#zen-progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  background: var(--lacquer);
  width: 0%;
  z-index: 999;
  transition: width 0.1s linear;
}

/* Header & Top Bar */
.zen-topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--paper);
  border-bottom: 1px solid var(--border-light);
  backdrop-filter: blur(8px);
  padding: 0.6rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
}

.zen-topbar-left {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  min-width: 0;
}

.zen-topbar-right {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-shrink: 0;
}

.btn-icon {
  background: var(--washi);
  border: 1px solid var(--border-light);
  color: var(--ink);
  padding: 0.4rem 0.75rem;
  border-radius: var(--radius-sm);
  font-family: var(--font-sans);
  font-size: 0.85rem;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}

.btn-icon:hover {
  background: var(--paper-warm);
  border-color: var(--border-hair);
  text-decoration: none;
}

.btn-primary {
  background: var(--indigo);
  color: #FFFFFF !important;
  border-color: var(--indigo);
}

.btn-primary:hover {
  background: var(--indigo-deep);
  color: #FFFFFF !important;
}

.btn-accent {
  background: var(--lacquer);
  color: #FFFFFF !important;
  border-color: var(--lacquer);
}

.btn-accent:hover {
  filter: brightness(0.9);
  color: #FFFFFF !important;
}


    .article-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem 1.25rem 6rem;
    }

    .prose h1, .prose h2, .prose h3 {
      font-family: var(--font-display);
      color: var(--ink);
      font-weight: 400;
      margin-top: 2.25rem;
      margin-bottom: 0.75rem;
    }

    .prose p {
      margin: 1.1rem 0;
      font-size: 1.125rem;
      line-height: 1.8;
      color: var(--text-body);
    }

    .prose blockquote {
      border-left: 3px solid var(--lacquer);
      background: var(--callout-bg);
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
      font-style: italic;
    }

    .prose table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
    }

    .prose th, .prose td {
      border: 1px solid var(--border-light);
      padding: 0.6rem 0.8rem;
    }

    .prose th {
      background: var(--paper-warm);
    }

    #status-msg {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      padding: 2rem;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div id="zen-progress"></div>

  <header class="zen-topbar">
    <div class="zen-topbar-left">
      <a href="index.html" class="btn-icon">← Hub</a>
      <span id="doc-title" style="font-family:var(--font-sans); font-size:0.85rem; font-weight:600; color:var(--ink);">
        AoPS Reader
      </span>
    </div>
    <div class="zen-topbar-right">
      <a id="sim-btn" href="#" class="btn-icon btn-accent" style="display:none;">⚡ Lab</a>
      <a id="raw-btn" href="#" class="btn-icon" target="_blank" style="display:none;">📄 Source</a>
      <button id="theme-btn" class="btn-icon">🌓</button>
    </div>
  </header>

  <main class="article-wrap">
    <div id="status-msg">Loading document...</div>
    <article id="content" class="prose"></article>
  </main>

  <script>
    // Theme toggle
    const themeBtn = document.getElementById('theme-btn');
    const currentTheme = localStorage.getItem('aops_theme') || 'zen';
    document.documentElement.setAttribute('data-theme', currentTheme);
    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const nextTheme = isDark ? 'zen' : 'dark';
      document.documentElement.setAttribute('data-theme', nextTheme);
      localStorage.setItem('aops_theme', nextTheme);
    });

    // Reading progress
    window.addEventListener('scroll', () => {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
      document.getElementById('zen-progress').style.width = scrolled + '%';
    });

    // Fetch and render markdown from query string ?src=path/to/file.md
    const params = new URLSearchParams(window.location.search);
    const src = params.get('src') || 'README.md';

    const statusEl = document.getElementById('status-msg');
    const contentEl = document.getElementById('content');
    const docTitle = document.getElementById('doc-title');
    const rawBtn = document.getElementById('raw-btn');
    const simBtn = document.getElementById('sim-btn');

    rawBtn.href = src;
    rawBtn.style.display = 'inline-flex';

    // If it's a course lesson, check for simulation.html in the same folder
    if (src.includes('course/') && src.endsWith('lesson.md')) {
      const simUrl = src.replace('lesson.md', 'simulation.html');
      simBtn.href = simUrl;
      simBtn.style.display = 'inline-flex';
    }

    docTitle.textContent = src.split('/').pop();

    fetch(src)
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
        return res.text();
      })
      .then(markdown => {
        statusEl.style.display = 'none';
        contentEl.innerHTML = marked.parse(markdown);
        // Try to update title from first h1
        const h1 = contentEl.querySelector('h1');
        if (h1) {
          document.title = h1.textContent + ' | AoPS';
          docTitle.textContent = h1.textContent;
        }
      })
      .catch(err => {
        statusEl.innerHTML = '<p style="color:var(--lacquer); font-weight:600;">Failed to load ' + src + '</p><p>' + err.message + '</p><p><a href="index.html" class="btn-icon" style="margin-top:1rem;">← Return to Index</a></p>';
      });
  </script>
</body>
</html>
